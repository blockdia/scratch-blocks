name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'blockdia/scratch-blocks'
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify release tag
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Release tag must be v' + p.version)"
      - run: npm ci
      - run: npm run test:lint
      - run: npm run build
      - name: Verify npm build artifacts
        run: |
          test -f dist/vertical.js
          test -f dist/horizontal.js
          test -f dist/web/vertical.js
          test -f dist/web/horizontal.js
      - run: npm pack --dry-run --ignore-scripts
      - run: npm publish --ignore-scripts
